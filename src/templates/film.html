<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="studio ghibli fan side made using free api out of curiousity">
    <meta name="author" content="Carlos E Alford">
    <title>Planet Ghibli</title>
    <link
      rel="preload"
      href="../assets/fonts/Oxygen-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>

    <!-- page header and navigation -->
    <header class="site-header">
      <p class="site-header__title">Planet Ghibli</p>
      <nav class="main-nav">
        <ul class="main-nav-list">
          <li class="main-nav-list__item active">
            <a href="index.html">HOME</a>
          </li>
        </ul>
      </nav>
    </header>

    <!-- all content for selected film -->
    <main id="pGhibliFilm" class="film">

      <!-- hero with title, original title and film trailer -->
      <section class="film-hero">
        <header>
          <div id="FilmHeroTitle" class="film-hero__header center-text"></div>
        </header>
        <div id="FilmHeroBanner" class="film-hero__body"></div>
      </section>

      <!-- leaflet part which talks about the film in more detail -->
      <section class="film-leaflet">
        <!-- films description -->
        <header>
          <h2 class="center-text">Film Description</h2>
        </header>
        <!-- film general information -->
        <div class="film-leaflet__body">
          <div id="LeafletDesc" class="leaflet-desc"></div>
          <ul class="leaflet-list">
            <!-- DELETE -->
            <li class="leaflet-list__item">Release Date: <span id="FilmReleaseDate"></span></li>
            <li class="leaflet-list__item">Running Time: <span id="FilmRunningTime"></span></li>
            <li class="leaflet-list__item">Director: <span id="FilmDirector"></span></li>
            <li class="leaflet-list__item">Producer: <span id="FilmProducer"></span></li>
          </ul>
        </div>
      </section>

      <!-- PEOPLE -->
      <section id="FilmPeople" class="film-extras">
        <header>
          <h2 class="center-text">People</h2>
        </header>
      </section>

      <!-- VEHICLES -->
      <section id="FilmVehicles" class="film-extras">
        <header>
          <h2 class="center-text">Vehicles</h2>
        </header>
      </section>

      <!-- LOCATIONS -->
      <section id="FilmLocations" class="film-extras">
        <header>
          <h2 class="center-text">Locations</h2>
        </header>
      </section>      

    </main>

    <!-- page footer -->
    <footer class="site-footer center-text">
      <p>Made with curiousity by Carlos E Alford</p>
      <p>2021-<span id="wsFooterYear"></span></p>
    </footer>

    <script>
      // dynamic footer date
      const date = new Date();
      document.querySelector('#wsFooterYear').innerText = date.getFullYear();
    </script>
  </body>
