<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="studio ghibli fan side made using free api out of curiousity">
    <meta name="author" content="Carlos E Alford">
    <title>Planet Ghibli</title>
    <link
      rel="preload"
      href="../assets/fonts/Oxygen-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>

    <!-- page header and navigation -->
    <header class="site-header">
      <p class="site-header__title">Planet Ghibli</p>
      <nav class="main-nav">
        <ul class="main-nav-list">
          <li class="main-nav-list__item active">
            <a href="#">HOME</a>
          </li>
        </ul>
      </nav>
    </header>

    <main id="pGhibliHome" class="home">

      <!-- Hero image -->
      <section class="hero">
        <div class="hero-card center-text">
          <h1>"May all your bacon burn"</h1>
        </div>
      </section>

      <!-- List of Ghibli films -->
      <section class="films">
        <header class="films-header center-text">
          <h2>Films are in chronological order</h2>
        </header>
        <div id="filmsBody" class="films-body"></div>
      </section>

    </main>

    <!-- page footer -->
    <footer class="site-footer center-text">
      <p>Made with curiousity by Carlos E Alford</p>
      <p>2021-<span id="wsFooterYear"></span></p>
    </footer>

    <script>
      // dynamic footer date
      const date = new Date();
      document.querySelector('#wsFooterYear').innerText = date.getFullYear();
    </script>
  </body>
